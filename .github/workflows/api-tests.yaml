name: API Tests

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Устанавливаем Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # 3. Устанавливаем Ruff
      - name: Install Ruff
        run: python -m pip install ruff

      # 4. Проверяем код
      - name: Run Ruff
        run: ruff check .

      # 5. Собираем и запускаем сервисы
      - name: Build and start services
        run: docker compose up -d --build

      # 6. Собираем Docker-образ для тестов
      - name: Build test image
        run: docker build -t api-tests -f Dockerfile .

      # 7. Запускаем API-тесты
      - name: Run API tests
        run: docker run --rm --network host api-tests

      # 8. Останавливаем контейнеры
      - name: Stop containers
        if: always()
        run: docker compose down